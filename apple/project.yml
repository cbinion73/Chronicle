name: Chronicle
options:
  bundleIdPrefix: com.binion
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: LGNJ56Y22G
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    OTHER_LDFLAGS: "$(inherited) -lsqlite3"
targetTemplates:
  ChronicleApp:
    sources:
      - path: ChronicleApp
        excludes:
          - WebApp
          - Info-iOS.plist
          - Info-macOS.plist
          - Chronicle-iOS.entitlements
          - Chronicle-macOS.entitlements
      - path: ChronicleApp/WebApp
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binion.chronicle
        PRODUCT_NAME: Chronicle
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      gatherCoverageData: false
targets:
  Chronicle:
    templates:
      - ChronicleApp
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        INFOPLIST_FILE: ChronicleApp/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: ChronicleApp/Chronicle-iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ChronicleTests
  ChronicleMac:
    templates:
      - ChronicleApp
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    settings:
      base:
        INFOPLIST_FILE: ChronicleApp/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: ChronicleApp/Chronicle-macOS.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    scheme: {}
  ChronicleTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ChronicleAppTests
    dependencies:
      - target: Chronicle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binion.chronicle.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
