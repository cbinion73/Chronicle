name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc -b
      - run: npx eslint .
      - run: npx vite build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to jarvis-vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/jarvis/apps/chronicle
            git pull origin main
            cd /home/jarvis/apps/jarvis/deploy
            docker compose up -d --build chronicle
            echo "✅ Chronicle deployed at $(date)"
